name: e2e (mocked)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels that PR's running e2e jobs. Other events get
# a group per run, so runs on main are never queued behind or cancelled by each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mocked:
    uses: ./.github/workflows/e2e.yml
    with:
      mode: mock
    secrets: inherit
