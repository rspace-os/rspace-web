name: e2e (mocked)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      java_version:
        description: 'Java version for the build and the app'
        type: choice
        options: ['17', '21']
        default: '17'

# A new push to a pull request cancels that PR's running e2e jobs. Other events get
# a group per run, so runs on main are never queued behind or cancelled by each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mocked:
    uses: ./.github/workflows/e2e.yml
    with:
      mode: mock
      java_version: ${{ inputs.java_version || '17' }}
    secrets: inherit
