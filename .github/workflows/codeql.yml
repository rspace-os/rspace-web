name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      # build-mode none does not compile, but the Java extractor still asks
      # Gradle for the dependency list (a failure there only degrades the
      # analysis), so give it the same JDK and Gradle User Home as the other
      # workflows. It reads the test jobs' cache without saving one of its own.
      - name: Set up JDK and Gradle
        if: matrix.language == 'java-kotlin'
        uses: ./.github/actions/setup-gradle-cached
        with:
          java-distribution: temurin
          java-version: 17
          cache-key: tests
          save-cache: 'false'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: /language:${{ matrix.language }}
