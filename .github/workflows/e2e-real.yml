name: e2e (real)

# Informational; do not require this check.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real:
    uses: ./.github/workflows/e2e.yml
    with:
      mode: real
      # Per-PR e2e stays on Java 17; this nightly run is where the real app runs on 21.
      java_version: "21"
    secrets: inherit
