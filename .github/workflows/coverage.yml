name: Coverage

# Whole-codebase JaCoCo coverage, run on a nightly schedule (and on manual
# dispatch). The work is split across two parallel runners that mirror the
# spring-tests/integration-tests split in lint-and-test.yml:
# - unit-spring-coverage: runs the `test` task (pure-unit + Spring) and emits
#   build/reports/jacoco/test/jacocoTestReport.xml
# - integration-coverage: runs only the `integrationTests` task and emits
#   build/reports/jacoco/integrationTests/jacocoIntegrationTestReport.xml
# Each job uploads only its own report; Codecov merges them server-side. Running
# them in parallel keeps wall-clock bounded by the slower (integration) shard
# rather than the sum of both phases.
# ponytail: this doubles DB schema-init cost (each shard runs drop-recreate-db);
# a pre-seeded DB image (planned) would remove that overhead.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:

permissions:
  contents: read

env:
  RS_FILE_BASE: /tmp/${{ github.ref_name }}-filestore
  CI: "true"

jobs:
  unit-spring-coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [21]
    services:
      db:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: rspacedbpwd
          MARIADB_DATABASE: rspace
          MARIADB_USER: rspacedbuser
          MARIADB_PASSWORD: rspacedbpwd
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=2g
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
          --health-start-period=30s
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-gradle-cached
        with:
          java-version: ${{ matrix.java-version }}
          cache-key: coverage

      - name: Configure MariaDB
        run: |
          mysql -h127.0.0.1 -uroot -prspacedbpwd <<'SQL'
          SET GLOBAL character_set_server = 'utf8mb4';
          SET GLOBAL collation_server = 'utf8mb4_unicode_ci';
          SET GLOBAL sql_mode = 'STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION';
          SET GLOBAL innodb_snapshot_isolation = 0;
          GRANT CREATE, DROP ON *.* TO 'rspacedbuser'@'%';
          -- scratch database for the HibernateTest-based model tests, which
          -- manage their own schema and skip when it is not available
          CREATE DATABASE IF NOT EXISTS hibtest;
          GRANT ALL ON hibtest.* TO 'rspacedbuser'@'%';
          FLUSH PRIVILEGES;
          SQL

      - name: Setup filestore
        run: |
          rm -rf $RS_FILE_BASE
          mkdir -p $RS_FILE_BASE

      - name: Seed dev deployment.properties
        run: |
          cp -f src/main/resources/deployments/dev/deployment.properties.example \
            src/main/resources/deployments/dev/deployment.properties

      - name: Run unit + Spring tests with coverage
        run: |
          ./gradlew test jacocoTestReport \
            -DenableTestCoverage -Denvironment=drop-recreate-db \
            -Djava-version=${{ matrix.java-version }} \
            -Djavax.xml.accessExternalDTD=all \
            -Dlog4j2.configurationFile=log4j2-dev.xml \
            -Dsurefire.rerunFailingTestsCount=1 \
            -Djdbc.server.db=rspace \
            -Djdbc.url=jdbc:mysql://localhost:3306/rspace \
            -DRS.devlogLevel=INFO \
            -DRS_FILE_BASE=${RS_FILE_BASE}

      - name: Coverage summary
        if: always()
        run: |
          csv=build/reports/jacoco/test/jacocoTestReport.csv
          [ -f "$csv" ] || { echo "No coverage report ($csv missing)." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          echo "### Unit + Spring coverage" >> "$GITHUB_STEP_SUMMARY"
          awk -F, 'NR>1{im+=$4;ic+=$5;bm+=$6;bc+=$7;lm+=$8;lc+=$9} END{
            printf "| Metric | Covered | Total | Coverage |\n|---|---|---|---|\n";
            printf "| Instructions | %d | %d | %.1f%% |\n", ic, ic+im, (ic+im)?100*ic/(ic+im):0;
            printf "| Branches | %d | %d | %.1f%% |\n", bc, bc+bm, (bc+bm)?100*bc/(bc+bm):0;
            printf "| Lines | %d | %d | %.1f%% |\n", lc, lc+lm, (lc+lm)?100*lc/(lc+lm):0;
          }' "$csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-unit-spring
          path: build/reports/jacoco/test
          if-no-files-found: ignore

      - name: Upload exec data for merge
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-exec-unit-spring
          path: build/jacoco/*.exec
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7.1.1
        with:
          files: build/reports/jacoco/test/jacocoTestReport.xml

  integration-coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [21]
    services:
      db:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: rspacedbpwd
          MARIADB_DATABASE: rspace
          MARIADB_USER: rspacedbuser
          MARIADB_PASSWORD: rspacedbpwd
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=2g
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
          --health-start-period=30s
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-gradle-cached
        with:
          java-version: ${{ matrix.java-version }}
          cache-key: coverage

      - name: Configure MariaDB
        run: |
          mysql -h127.0.0.1 -uroot -prspacedbpwd <<'SQL'
          SET GLOBAL character_set_server = 'utf8mb4';
          SET GLOBAL collation_server = 'utf8mb4_unicode_ci';
          SET GLOBAL sql_mode = 'STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION';
          SET GLOBAL innodb_snapshot_isolation = 0;
          GRANT CREATE, DROP ON *.* TO 'rspacedbuser'@'%';
          FLUSH PRIVILEGES;
          SQL

      - name: Setup filestore
        run: |
          rm -rf $RS_FILE_BASE
          mkdir -p $RS_FILE_BASE

      - name: Seed dev deployment.properties
        run: |
          cp -f src/main/resources/deployments/dev/deployment.properties.example \
            src/main/resources/deployments/dev/deployment.properties

      - name: Run integration tests with coverage
        run: |
          ./gradlew integrationTests jacocoIntegrationTestReport \
            -DenableTestCoverage -Denvironment=drop-recreate-db \
            -Djava-version=${{ matrix.java-version }} \
            -Djavax.xml.accessExternalDTD=all \
            -Dlog4j2.configurationFile=log4j2-dev.xml \
            -Dsurefire.rerunFailingTestsCount=1 \
            -Djdbc.server.db=rspace \
            -Djdbc.url=jdbc:mysql://localhost:3306/rspace \
            -DRS.devlogLevel=INFO \
            -DRS_FILE_BASE=${RS_FILE_BASE}

      - name: Coverage summary
        if: always()
        run: |
          csv=build/reports/jacoco/integrationTests/jacocoIntegrationTestReport.csv
          [ -f "$csv" ] || { echo "No coverage report ($csv missing)." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          echo "### Integration coverage" >> "$GITHUB_STEP_SUMMARY"
          awk -F, 'NR>1{im+=$4;ic+=$5;bm+=$6;bc+=$7;lm+=$8;lc+=$9} END{
            printf "| Metric | Covered | Total | Coverage |\n|---|---|---|---|\n";
            printf "| Instructions | %d | %d | %.1f%% |\n", ic, ic+im, (ic+im)?100*ic/(ic+im):0;
            printf "| Branches | %d | %d | %.1f%% |\n", bc, bc+bm, (bc+bm)?100*bc/(bc+bm):0;
            printf "| Lines | %d | %d | %.1f%% |\n", lc, lc+lm, (lc+lm)?100*lc/(lc+lm):0;
          }' "$csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-integration
          path: build/reports/jacoco/integrationTests
          if-no-files-found: ignore

      - name: Upload exec data for merge
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-exec-integration
          path: build/jacoco/*.exec
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7.1.1
        with:
          files: build/reports/jacoco/integrationTests/jacocoIntegrationTestReport.xml

  # Combines the two shards' exec data into one figure. JaCoCo merges at the
  # instruction level (a line covered by either unit or IT tests counts once),
  # which summing the per-shard CSVs cannot do. Gradle's jacocoMergedReport
  # compiles the main classes (no tests, no DB, no frontend) and reports every
  # downloaded exec file. Codecov already merges its two uploads server-side, so
  # the merged report is NOT re-uploaded there.
  merge-coverage:
    runs-on: ubuntu-latest
    needs: [unit-spring-coverage, integration-coverage]
    if: always()
    strategy:
      matrix:
        java-version: [21]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-gradle-cached
        with:
          java-version: ${{ matrix.java-version }}
          cache-key: coverage
          save-cache: 'false'

      - name: Download unit + Spring exec
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-exec-unit-spring
          path: build/jacoco

      - name: Download integration exec
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-exec-integration
          path: build/jacoco

      # Each shard uploads build/jacoco/<test task>.exec, so the two downloads
      # above land side by side without clashing.
      - name: Merge and report
        run: |
          shopt -s nullglob
          execs=(build/jacoco/*.exec)
          if [ ${#execs[@]} -eq 0 ]; then
            echo "No coverage exec data to merge." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ./gradlew -q jacocoMergedReport -DenableTestCoverage \
            -Djava-version=${{ matrix.java-version }}
          echo "### Combined coverage (unit + Spring + integration)" >> "$GITHUB_STEP_SUMMARY"
          awk -F, 'NR>1{im+=$4;ic+=$5;bm+=$6;bc+=$7;lm+=$8;lc+=$9} END{
            printf "| Metric | Covered | Total | Coverage |\n|---|---|---|---|\n";
            printf "| Instructions | %d | %d | %.1f%% |\n", ic, ic+im, (ic+im)?100*ic/(ic+im):0;
            printf "| Branches | %d | %d | %.1f%% |\n", bc, bc+bm, (bc+bm)?100*bc/(bc+bm):0;
            printf "| Lines | %d | %d | %.1f%% |\n", lc, lc+lm, (lc+lm)?100*lc/(lc+lm):0;
          }' build/reports/jacoco/merged/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged HTML coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-merged
          path: build/reports/jacoco/merged
          if-no-files-found: ignore
