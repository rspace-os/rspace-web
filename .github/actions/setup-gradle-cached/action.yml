name: Set up JDK and Gradle
description: >-
  Install the JDK, restore Gradle User Home from the Actions cache, and set up
  Gradle (which validates the wrapper jar). Run after checkout and before any
  `pnpm install`, so the cache key's `**/*.gradle*` glob does not walk node_modules.

inputs:
  java-distribution:
    description: setup-java distribution, e.g. "temurin".
    default: temurin
  java-version:
    description: JDK major version, e.g. "17" or "21".
    default: "17"
  cache-key:
    description: >-
      Cache family. Jobs that resolve the same dependencies share one, so a job
      that resolves only a few (Spotless, CodeQL) never saves the entry the test
      jobs restore.
    required: true
  compilation-artifact:
    description: Optional compilation artifact from this workflow run and checkout.
    default: ""
  save-cache:
    description: Whether this job may save the cache. Only runs on main ever save.
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v5.4.0
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}

    # Gradle reads non-ASCII test resource file names, so it must never start
    # under LC_ALL=C. Ubuntu runners default to C.UTF-8; pin it anyway.
    - name: Use a UTF-8 locale
      shell: bash
      run: echo "LANG=C.UTF-8" >> "$GITHUB_ENV"

    # Only main saves: pull requests can restore main's caches, but not each
    # other's. The full action's post step saves when the key missed.
    - name: Cache Gradle User Home
      if: github.ref == 'refs/heads/main' && inputs.save-cache == 'true'
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-deps-v2-${{ runner.os }}-${{ inputs.cache-key }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/pinned-versions.txt', 'gradle.properties', 'buildSrc/build.gradle', 'buildSrc/src/**') }}
        restore-keys: |
          gradle-deps-v2-${{ runner.os }}-${{ inputs.cache-key }}-
          gradle-deps-v2-${{ runner.os }}-

    - name: Restore Gradle User Home
      if: github.ref != 'refs/heads/main' || inputs.save-cache != 'true'
      uses: actions/cache/restore@v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-deps-v2-${{ runner.os }}-${{ inputs.cache-key }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/pinned-versions.txt', 'gradle.properties', 'buildSrc/build.gradle', 'buildSrc/src/**') }}
        restore-keys: |
          gradle-deps-v2-${{ runner.os }}-${{ inputs.cache-key }}-
          gradle-deps-v2-${{ runner.os }}-

    # Actions cache entries are immutable. Task outputs need a new archive per
    # main revision; otherwise compiled classes stay stuck at the first seed.
    - name: Cache Gradle task outputs
      if: github.ref == 'refs/heads/main' && inputs.save-cache == 'true'
      uses: actions/cache@v6.1.0
      with:
        path: ~/.gradle/rspace-build-cache
        key: gradle-tasks-v1-${{ runner.os }}-${{ inputs.java-distribution }}-${{ inputs.java-version }}-${{ inputs.cache-key }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/pinned-versions.txt', 'gradle.properties', 'buildSrc/build.gradle', 'buildSrc/src/**') }}-${{ github.sha }}
        restore-keys: |
          gradle-tasks-v1-${{ runner.os }}-${{ inputs.java-distribution }}-${{ inputs.java-version }}-${{ inputs.cache-key }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/pinned-versions.txt', 'gradle.properties', 'buildSrc/build.gradle', 'buildSrc/src/**') }}-
          gradle-tasks-v1-${{ runner.os }}-${{ inputs.java-distribution }}-${{ inputs.java-version }}-${{ inputs.cache-key }}-

    - name: Restore Gradle task outputs
      if: github.ref != 'refs/heads/main' || inputs.save-cache != 'true'
      uses: actions/cache/restore@v6.1.0
      with:
        path: ~/.gradle/rspace-build-cache
        key: gradle-tasks-v1-${{ runner.os }}-${{ inputs.java-distribution }}-${{ inputs.java-version }}-${{ inputs.cache-key }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/pinned-versions.txt', 'gradle.properties', 'buildSrc/build.gradle', 'buildSrc/src/**') }}-${{ github.sha }}
        restore-keys: |
          gradle-tasks-v1-${{ runner.os }}-${{ inputs.java-distribution }}-${{ inputs.java-version }}-${{ inputs.cache-key }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/pinned-versions.txt', 'gradle.properties', 'buildSrc/build.gradle', 'buildSrc/src/**') }}-
          gradle-tasks-v1-${{ runner.os }}-${{ inputs.java-distribution }}-${{ inputs.java-version }}-${{ inputs.cache-key }}-

    # Artifacts are scoped to this workflow run. PR-produced entries never
    # become global caches or cross the main/PR trust boundary.
    - name: Download shared compilation
      id: shared-compilation
      continue-on-error: true
      if: inputs.compilation-artifact != ''
      uses: actions/download-artifact@v8.0.1
      with:
        name: ${{ inputs.compilation-artifact }}
        path: ${{ runner.temp }}/rspace-compilation

    - name: Restore shared compilation
      if: steps.shared-compilation.outcome == 'success'
      shell: bash
      run: |
        mkdir -p "$HOME/.gradle/rspace-build-cache"
        tar -xf "$RUNNER_TEMP/rspace-compilation/compilation-cache.tar" \
          -C "$HOME/.gradle/rspace-build-cache" --no-same-owner

    # cache-provider external leaves Gradle User Home to the steps above: the
    # default ('enhanced') is a proprietary component under Gradle's terms of
    # use since gradle/actions v6. Wrapper validation still runs
    # (validate-wrappers defaults to true whatever the cache provider).
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6.4.1
      with:
        cache-provider: external
