name: Set up JDK and Gradle
description: >-
  Install Temurin, restore Gradle User Home from the Actions cache, and set up
  Gradle (which validates the wrapper jar). Run after checkout and before any
  `pnpm install`, so the cache key's `**/*.gradle*` glob does not walk node_modules.

inputs:
  java-version:
    description: JDK major version, e.g. "17" or "21".
    default: "17"
  cache-key:
    description: >-
      Cache family. Jobs that resolve the same dependencies share one, so a job
      that resolves only a few (Spotless, CodeQL) never saves the entry the test
      jobs restore.
    required: true
  save-cache:
    description: Whether this job may save the cache. Only runs on main ever save.
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v6.2.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    # Gradle reads non-ASCII test resource file names, so it must never start
    # under LC_ALL=C. Ubuntu runners default to C.UTF-8; pin it anyway.
    - name: Use a UTF-8 locale
      shell: bash
      run: echo "LANG=C.UTF-8" >> "$GITHUB_ENV"

    # Both archives are keyed by the build declarations, hashed once here.
    # Only main saves: pull requests can restore main's caches, but not each
    # other's, and the cache action's post step saves only when its key missed.
    - name: Compute Gradle cache keys
      id: keys
      shell: bash
      env:
        BUILD_HASH: ${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/pinned-versions.txt', 'gradle.properties', 'buildSrc/build.gradle', 'buildSrc/src/**') }}
        FAMILY: ${{ inputs.cache-key }}
        JAVA_VERSION: ${{ inputs.java-version }}
        SAVE: ${{ github.ref == 'refs/heads/main' && inputs.save-cache == 'true' }}
      run: |
        {
          echo "build=$BUILD_HASH"
          echo "deps=gradle-deps-v2-$RUNNER_OS"
          echo "tasks=gradle-tasks-v1-$RUNNER_OS-$JAVA_VERSION-$FAMILY"
          echo "save=$SAVE"
        } >> "$GITHUB_OUTPUT"

    - name: Cache Gradle User Home
      if: steps.keys.outputs.save == 'true'
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ steps.keys.outputs.deps }}-${{ inputs.cache-key }}-${{ steps.keys.outputs.build }}
        restore-keys: |
          ${{ steps.keys.outputs.deps }}-${{ inputs.cache-key }}-
          ${{ steps.keys.outputs.deps }}-

    - name: Restore Gradle User Home
      if: steps.keys.outputs.save != 'true'
      uses: actions/cache/restore@v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ steps.keys.outputs.deps }}-${{ inputs.cache-key }}-${{ steps.keys.outputs.build }}
        restore-keys: |
          ${{ steps.keys.outputs.deps }}-${{ inputs.cache-key }}-
          ${{ steps.keys.outputs.deps }}-

    # Actions cache entries are immutable. Task outputs need a new archive per
    # main revision; otherwise compiled classes stay stuck at the first seed.
    - name: Cache Gradle task outputs
      if: steps.keys.outputs.save == 'true'
      uses: actions/cache@v6.1.0
      with:
        path: ~/.gradle/rspace-build-cache
        key: ${{ steps.keys.outputs.tasks }}-${{ steps.keys.outputs.build }}-${{ github.sha }}
        restore-keys: |
          ${{ steps.keys.outputs.tasks }}-${{ steps.keys.outputs.build }}-
          ${{ steps.keys.outputs.tasks }}-

    - name: Restore Gradle task outputs
      if: steps.keys.outputs.save != 'true'
      uses: actions/cache/restore@v6.1.0
      with:
        path: ~/.gradle/rspace-build-cache
        key: ${{ steps.keys.outputs.tasks }}-${{ steps.keys.outputs.build }}-${{ github.sha }}
        restore-keys: |
          ${{ steps.keys.outputs.tasks }}-${{ steps.keys.outputs.build }}-
          ${{ steps.keys.outputs.tasks }}-

    # cache-provider external leaves Gradle User Home to the steps above: the
    # default ('enhanced') is a proprietary component under Gradle's terms of
    # use since gradle/actions v6. Wrapper validation still runs
    # (validate-wrappers defaults to true whatever the cache provider).
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6.4.1
      with:
        cache-provider: external
