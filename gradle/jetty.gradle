// jettyRun and jettyRunWar: RSpace on embedded Jetty, replacing Maven's `jetty:run` and
// `jetty:run-war`. Applied from build.gradle. See DevDocs/DeveloperNotes/Gradle.md.
//
// The launcher (src/jetty/java) runs in its own JVM with Jetty 12 ee10 on its classpath. The
// Jetty jars live only in the `jetty` source set's configurations, so they never reach the WAR.
//
// - Every command-line -D<name>=<value> becomes a system property of the Jetty JVM, as it was of
//   the Maven JVM that ran jetty:run in-process.
// - -Djetty.http.port=<port> sets the HTTP port (default 8080).
// - -Dssl.enabled=true configures the server from jetty/*.xml (HTTP on 8080, HTTPS on 8443), as
//   the Maven build's jetty-ssl profile did.
// - -PjettyJvmArgs='<args>' (or the ORG_GRADLE_PROJECT_jettyJvmArgs environment variable) adds
//   whitespace-separated JVM arguments, e.g. -Xmx4g, -agentlib:jdwp=..., -javaagent:..., which
//   Maven took from MAVEN_OPTS.

def jettyVersion = '12.1.11'

// The command-line -D map from build.gradle: bare flags read as 'true', as with Maven, and the
// values are configuration cache inputs, so changing a -D flag invalidates a stored entry.
def cliProps = new TreeMap<String, String>(project.ext.cliSystemProperties as Map<String, String>)
def cliOrGradleProperty = { String name -> cliProps.containsKey(name) ? cliProps[name] : providers.gradleProperty(name).getOrNull() }

sourceSets {
  jetty {
    java.srcDir 'src/jetty/java'
  }
}

// The build forces the app's pinned versions (e.g. slf4j-api) onto every configuration. The Jetty
// launcher's classpath is separate from the app's, so it resolves Jetty's own versions instead.
['jettyCompileClasspath', 'jettyRuntimeClasspath'].each { name ->
  configurations.named(name) { resolutionStrategy.setForcedModules() }
}

dependencies {
  jettyImplementation platform("org.eclipse.jetty:jetty-bom:${jettyVersion}")
  jettyImplementation platform("org.eclipse.jetty.ee10:jetty-ee10-bom:${jettyVersion}")
  // what jetty-ee10-maven-plugin puts on the server classpath
  jettyImplementation 'org.eclipse.jetty.ee10:jetty-ee10-webapp'
  jettyImplementation 'org.eclipse.jetty.ee10:jetty-ee10-annotations'
  jettyImplementation 'org.eclipse.jetty.ee10:jetty-ee10-plus'
  jettyImplementation 'org.eclipse.jetty:jetty-xml'
  jettyRuntimeOnly 'org.eclipse.jetty:jetty-jndi'
  jettyRuntimeOnly 'org.eclipse.jetty.ee10:jetty-ee10-apache-jsp'
  jettyRuntimeOnly 'org.eclipse.jetty.ee10:jetty-ee10-glassfish-jstl'
  jettyRuntimeOnly 'org.eclipse.jetty.ee10.websocket:jetty-ee10-websocket-jakarta-server'
  jettyRuntimeOnly 'org.eclipse.jetty.ee10.websocket:jetty-ee10-websocket-jetty-server'
  // what the Maven build's jetty-ssl profile added, for jetty/jetty-https.xml
  jettyRuntimeOnly 'org.eclipse.jetty:jetty-alpn-server'
  jettyRuntimeOnly 'org.eclipse.jetty:jetty-alpn-java-server'
  jettyRuntimeOnly 'org.eclipse.jetty.http2:jetty-http2-server'
  // Jetty's own logging; the webapp keeps its log4j2 binding
  jettyRuntimeOnly 'org.eclipse.jetty:jetty-slf4j-impl'
}

def jettyDir = layout.buildDirectory.dir('jetty')
def sslEnabled = cliOrGradleProperty('ssl.enabled') == 'true'
def jettyXmls = ['jetty.xml', 'jetty-http.xml', 'jetty-ssl.xml', 'jetty-https.xml'].collect {
  file("jetty/${it}").absolutePath
}
// the JVM options formerly in .mvn/jvm.config, which the Maven jetty:run JVM had
def defaultJvmArgs = [
  '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.io=ALL-UNNAMED',
  '--add-opens=java.rmi/sun.rmi.transport=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED',
]
def extraJvmArgs = providers.gradleProperty('jettyJvmArgs').map { it.trim().split(/\s+/).findAll { !it.isEmpty() } }

// jetty:run's classpath: compiled classes, processed resources and the WAR's libraries.
def webappClasspath = sourceSets.main.output + (configurations.runtimeClasspath - configurations.providedRuntime)
def writeWebappClasspath = tasks.register('jettyWebappClasspath') {
  description = 'Lists the webapp classpath for jettyRun.'
  def entries = webappClasspath
  def out = jettyDir.map { it.file('webapp-classpath.txt') }
  inputs.files(entries).withPropertyName('classpath')
  outputs.file(out)
  doLast {
    out.get().asFile.text = entries.files.collect { it.absolutePath }.join('\n') + '\n'
  }
}

def launcherClasspath = sourceSets.jetty.runtimeClasspath
def launcherMain = 'com.researchspace.jetty.JettyLauncher'
def configureJetty = { JavaExec task ->
  task.group = 'application'
  task.classpath = launcherClasspath
  task.mainClass = launcherMain
  task.workingDir = projectDir
  task.jvmArgs defaultJvmArgs
  task.jvmArgumentProviders.add({ extraJvmArgs.getOrElse([]) } as CommandLineArgumentProvider)
  task.systemProperties cliProps
  if (sslEnabled) {
    jettyXmls.each { task.args '--jetty-xml', it }
  }
  // -Denvironment=drop-recreate-db (or drop-recreate-hibernate-db) recreates the database first,
  // as the Maven build's database reset profiles did in its initialize phase.
  if (project.ext.recreatesDatabase) {
    task.dependsOn 'recreateDatabase'
  }
}

// Both launch paths consume the same JVM options, properties, classpath and program args.
def explodedArgs = ['--webapp', file('src/main/webapp').absolutePath,
                    '--context-path', '/', '--redeploy-on-stdin',
                    '--classpath-file', jettyDir.get().file('webapp-classpath.txt').asFile.absolutePath,
                    '--temp-dir', jettyDir.get().dir('run-tmp').asFile.absolutePath]
def sslArgs = sslEnabled ? jettyXmls.collectMany { ['--jetty-xml', it] } : []
def prepareExploded = { task ->
  task.dependsOn writeWebappClasspath
  if (project.ext.recreatesDatabase) task.dependsOn 'recreateDatabase'
  if (cliOrGradleProperty('generateReactDist') != null && tasks.names.contains('buildFrontend')) {
    task.dependsOn 'buildFrontend'
  }
}

tasks.register('jettyRun', JavaExec) {
  description = 'Runs RSpace exploded on Jetty, from compiled classes and src/main/webapp.'
  configureJetty(it)
  prepareExploded(it)
  args explodedArgs
  standardInput = System.in
}

tasks.register('jettyLaunchArgs') {
  group = 'application'
  description = 'Builds the exploded webapp and writes jetty/launch.args under the build directory for java @argfile.'
  prepareExploded(it)
  def launchArgs = defaultJvmArgs + cliProps.collect { k, v -> "-D${k}=${v}".toString() }
  def programArgs = sslArgs + explodedArgs
  def extra = extraJvmArgs
  def cp = launcherClasspath
  def main = launcherMain
  def out = jettyDir.map { it.file('launch.args') }
  inputs.property('jvmArgs', launchArgs)
  inputs.property('extraJvmArgs', extra.orElse([]))
  inputs.property('programArgs', programArgs)
  inputs.files(cp).withPropertyName('launcherClasspath')
  outputs.file(out)
  doLast {
    // Java argfiles need quoting even for JSON properties and paths containing spaces.
    def quote = { String arg ->
      '"' + arg.replace('\\', '\\\\').replace('"', '\\"')
          .replace('\n', '\\n').replace('\r', '\\r').replace('\t', '\\t') + '"'
    }
    def args = launchArgs + extra.getOrElse([]) + ['-cp', cp.asPath, main] + programArgs
    def output = out.get().asFile
    output.parentFile.mkdirs()
    output.createNewFile()
    // JVM properties may contain local integration credentials.
    output.setReadable(false, false)
    output.setReadable(true, true)
    output.setWritable(false, false)
    output.setWritable(true, true)
    output.text = args.collect { quote(it.toString()) }.join('\n') + '\n'
  }
}

tasks.register('jettyRunWar', JavaExec) {
  description = 'Runs a WAR on Jetty: -PwarFile=<path>, or else the WAR this build makes.'
  configureJetty(it)
  def warFile = providers.gradleProperty('warFile').map { file(it).absolutePath }
  if (!warFile.isPresent()) {
    def war = tasks.named('war', War)
    dependsOn war
    warFile = war.flatMap { it.archiveFile }.map { it.asFile.absolutePath }
  }
  def tempDir = jettyDir.map { it.dir('run-war-tmp').asFile.absolutePath }
  argumentProviders.add({ ['--war', warFile.get(), '--context-path', '/', '--temp-dir', tempDir.get()] } as CommandLineArgumentProvider)
}
