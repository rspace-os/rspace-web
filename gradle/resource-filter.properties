# Default values for ${...} and @...@ placeholders in filtered resources.
# Override any of them with -D<name>=<value> (or -P<name>=<value>); -Denvironment=<profile> also
# sets some (see build.gradle). The jdbc.*.maven names are kept from the Maven build.
copyright.year=2026
context.path=/
RS.logLevel=WARN
spring.logLevel=WARN
hibernate.logLevel=ERROR
hibernate.search.index=FTsearchIndices
lucene.attachment.searchIndex=LuceneFTsearchIndices
RSRequest.log.file=RSLogs.txt
RSRequest.log.maxFileSize=5Mb
RSSecurityEvent.log.file=SecurityEvents.txt
RSfailedEmails.log.file=emailErrors.txt
ApiRequests.log.file=ApiRequests.txt
deployment=dev
propertyFileDirPlaceholder=classpath:deployments/${deployment}
legacyAssetCacheBustingInDevMode=false
groupcreation=false
jdbc.driverClassName.maven=com.mysql.cj.jdbc.Driver
jdbc.username.maven=rspacedbuser
jdbc.password.maven=rspacedbpwd
jdbc.url.maven=jdbc:mysql://localhost:3306
jdbc.db.maven=rspace
hibernate.dialect=org.hibernate.dialect.MariaDB106Dialect
hibernate.formatSql=false
hibernate.showSqlComments=false
hibernate.sqlLogLevel=INFO
hibernate.showStats=false
hibernate.statsLogLevel=INFO
hibernate.showSQL=false
