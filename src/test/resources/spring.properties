# Bounds Spring's test ApplicationContext cache (default 32). Least recently used contexts are
# closed once the cache is full.
#
# Each cached RSpace context keeps its own Hibernate SessionFactory, Blaze-Persistence metamodel,
# in-heap Lucene indexes and Hibernate Search worker threads. Measured on the integration-test
# fork (-Xmx1536m): about 220 MB of base heap plus about 68 MB per cached context. The integration
# suite builds more than 20 distinct contexts (every @TestPropertySource, @DynamicPropertySource
# or custom context annotation gets its own), so an unbounded cache ran out of heap after 19.
# Most of those contexts serve a single test class, so evicting them costs almost no reloads.
# Budget: 220 MB + 8 x 68 MB is about 0.8 GB live, leaving headroom for context startup and
# heavy tests such as export/import.
spring.test.context.cache.maxSize=8
