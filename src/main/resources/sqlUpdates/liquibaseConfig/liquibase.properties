### This property file is referred to by Maven during 'generateDiff'
### task that outputs differences between schema created out of hibernate mappings
### vs schema created by liquibase updates.
driver=org.mariadb.jdbc.Driver
# useMysqlMetadata: the generateDiff plugin's Liquibase 3.3.5 only supports a database reporting itself as MySQL
username=rspacedbuser
password=rspacedbpwd
url=jdbc:mariadb://localhost:3306/rspace?useMysqlMetadata=true
referenceUrl=jdbc:mariadb://localhost:3306/rspace_hib?useMysqlMetadata=true
referenceUsername=rspacedbuser
referencePassword=rspacedbpwd
#This property isn't referred to by the 
changeLogFile=/src/main/resources/sqlUpdates/liquibase-master.xml