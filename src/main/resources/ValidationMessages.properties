### Default Hibernate validator file for resolving message properties

## reusable error fragments
errors.string.range="${validatedValue.length() > 20 ? validatedValue.substring(0,10).concat("...") : validatedValue }" \
must be between {min} and {max} characters but was length ${validatedValue.length()}.
errors.string.max="${validatedValue.length() > 20 ? validatedValue.substring(0,10).concat("...") : validatedValue }" \
must be less than {max} characters but was length ${validatedValue.length()}.
errors.required.field= is a required field.
errors.collection.range=There must be between {min} and {max}
errors.email.format="${validatedValue}" is an invalid email format.

errors.inventory.search.resultType.invalid=Requested result type must be one of: SAMPLE, SUBSAMPLE, CONTAINER, SAMPLE_TEMPLATE, INSTRUMENT or INSTRUMENT_TEMPLATE

description=Description
