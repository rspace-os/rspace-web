errors.api.pagination.limit.range=Limit must be between 1 and 100.
errors.api.v2.depth.range=Depth must be between 0 and 10.
errors.api.v2.where.length=The where expression must not exceed 4096 characters.
errors.api.v2.maintenance.startDate.required=Start date is required.
