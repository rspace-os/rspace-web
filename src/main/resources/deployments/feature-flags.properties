# Emergency feature flag overrides.
#
# Each line forces one flag to the same value for every user, for example
# bookingEnabled=true.
# - Keys must match a flag name in feature-flags/feature-flags.jsonc exactly
#   (names are case-sensitive). Values must be true or false. Any other key or
#   value stops startup.
# - A value set here takes priority over user overrides, the database baseline
#   and the default in the flag definition. The UI and REST API report it as
#   PROPERTIES_FILE and cannot change it.
# - Changes take effect after a restart.
#
# Keep this file empty in the repository. To force a flag on one server without
# rebuilding, set -DfeatureFlags.properties.location=/path/to/file. That file is
# then read instead of this one; the two are not merged.
#
# See DevDocs/DeveloperNotes/FeatureFlags.md.
