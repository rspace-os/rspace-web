# Root manifest manages git hooks and frontend dependencies/scripts.
packages: []

virtualStoreType: global
# TypeScript must find peer types beside packages outside the project tree.
addMissingPeerTypes: true

overrides:
  # Force miew-react 0.12.0 (ketcher-react pulls 0.11.0 transitively). 0.12.0
  # declares a react/react-dom peer of >=18.2.0, so it supports React 19 without
  # the allowedVersions workaround that 0.11.0 (peer ^18.2.0) needed.
  miew-react: 0.12.0
  # miew-react@0.12.0 was published with a broken "miew": "workspace:^"
  # dependency (the workspace protocol only resolves inside miew's own
  # monorepo). Redirect it to the published miew 0.12.0 on npm.
  miew-react>miew: 0.12.0

packageExtensions:
  # The color picker imports Lezer without declaring the dependency.
  '@replit/codemirror-css-color-picker@6.3.0':
    dependencies:
      '@lezer/common': 1.5.2
  # Scalar imports @scalar/types at runtime but declares it as a devDependency.
  '@scalar/schemas@0.8.3':
    dependencies:
      '@scalar/types': 0.18.2
  # posthog-js/react imports React without declaring it in the published package.
  posthog-js:
    peerDependencies:
      react: '*'
    peerDependenciesMeta:
      react:
        optional: true
  # The gallery imports createPortal without declaring its react-dom peer.
  react-photoswipe-gallery:
    peerDependencies:
      react-dom: '*'
  # The published toast component imports Vue without declaring its peer.
  vue-sonner@1.3.2:
    peerDependencies:
      vue: ^3.0.0
  # ketcher 3.18.0 imports Node's `events` without declaring it, so the editor
  # dies with "EventEmitter is not a constructor". `overrides` can't add an
  # undeclared dep. Expected fixed in ketcher 4.x. Drop when
  # epam/ketcher#11911 lands.
  ketcher-core:
    dependencies:
      events: 3.3.0
  ketcher-standalone:
    dependencies:
      events: 3.3.0

allowBuilds:
  lefthook: true
  '@swc/core': true
  canvas: true
  core-js: true
  # core-js-pure ships the same postinstall funding banner as core-js, just
  # under a separate package name; pulled in transitively by @mui/x-chat.
  core-js-pure: true
  esbuild: true
  # msw's postinstall only prints a funding notice; allow it so frozen
  # installs don't fail with ERR_PNPM_IGNORED_BUILDS.
  msw: true
  protobufjs: true
  vue-demi: true
  # Storybook's test configuration is maintained in .storybook, not by its installer.
  '@storybook/addon-vitest': false

# Block packages published less than 7 days ago (10080 minutes) as a defence
# against supply-chain attacks that are typically caught within that window.
# Stricter than pnpm 11's 1440-minute (1 day) default.
minimumReleaseAge: 10080
strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    # @sa11y/vitest pulls an older vitest, which wants the matching UI+browser packages.
    'vitest>@vitest/ui': 4.1.10
    'vitest>@vitest/browser': 4.1.10
