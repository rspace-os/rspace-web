# Git hooks managed by lefthook (https://lefthook.dev).
# Enable once per clone by running `pnpm install` in the repo root.
colors: false

pre-commit:
  parallel: true
  commands:
    # Refuse to commit local secret/config files. `.gitignore` already covers
    # the known paths, but `git add -f` and new locations slip through, so match
    # by filename instead: `.env`/`.env.*` and `deployment.properties` exactly.
    # The name is anchored, so `defaultDeployment.properties` (the checked-in
    # defaults) and `deployment.properties.example` (the dev template) do not
    # match; `*.example` is excluded so `.env.example` stays committable.
    # To add or change a property for everyone, edit the template
    # `deployments/dev/deployment.properties.example`, and
    # `deployments/defaultDeployment.properties` when the property has a
    # sensible production value. Never your own `deployment.properties`: it is
    # git-ignored, so nobody else would ever see the change.
    # Escape hatch: `git commit --no-verify`.
    secret-files:
      run: |
        blocked=$(printf '%s\n' {staged_files} \
          | grep -iE '(^|/)(\.env(\..+)?|deployment\.properties)$' \
          | grep -viE '\.example$' \
          | sed 's/^/  /' || true)
        if [ -n "$blocked" ]; then
          echo "Refusing to commit local secret/config files:" >&2
          echo "$blocked" >&2
          echo "To share a property change, edit deployment.properties.example (and" >&2
          echo "defaultDeployment.properties if it has a production value) instead." >&2
          echo "Unstage them (git restore --staged <file>), or use --no-verify if intentional." >&2
          exit 1
        fi
    # Fail the commit if any staged Java file is not spotless-formatted.
    # spotlessFiles matches the absolute path via String#matches, so each
    # staged (repo-relative) path is prefixed with `.*` to anchor correctly.
    # git reports forward slashes, but the absolute path spotless matches uses
    # the OS separator (backslashes on Windows), so each `/` is turned into a
    # `[/\\]` class; without this the pattern matches nothing on Windows and the
    # check silently passes.
    # Guard against an empty list (drop blank lines) so we never fall back to
    # `-DspotlessFiles=".*"`, which would match every file in the repo.
    # -DspotlessStrict adds the CleanThat checks; scoped to staged files, so it
    # never blocks a commit over an untouched file elsewhere.
    spotless:
      glob: "**/*.java"
      run: |
        spotless_files=$(printf '%s\n' {staged_files} \
          | sed '/^$/d; s/[.[\](){}+^$|\\]/\\&/g; s#/#[/\\\\]#g; s#^#.*#' \
          | paste -sd, -)
        if [ -n "$spotless_files" ]; then
          ./mvnw -q spotless:check -DspotlessStrict -DspotlessFiles="$spotless_files"
        fi
    # Type-check the frontend when any staged TS/TSX file changes. tsc is a
    # whole-project check, so we run the full `tsc --noEmit` rather than a
    # per-file subset.
    tsc:
      glob: "src/main/webapp/ui/**/*.{ts,tsx}"
      run: pnpm run tsc
    # Lint/format-check the frontend with Biome when any staged TS/TSX/CSS file
    # changes. Reject the commit on ANY Biome diagnostic: --error-on-warnings
    # makes warnings (and errors) fail the exit code, and --diagnostic-level=info
    # surfaces info-level diagnostics too. Biome lints the whole UI tree in well
    # under a second, so we run it project-wide like tsc rather than per-file.
    biome:
      glob: "src/main/webapp/ui/**/*.{ts,tsx,css}"
      run: pnpm run lint:ci --colors=off
    # Keep the i18n catalogs in sync with the code: i18n:check (extract --ci)
    # fails if a key was added/removed/reordered without regenerating the
    # catalogs, and i18n:lint enforces the i18next lint rules. Triggered by any
    # staged UI source or locale-catalog change.
    i18n:
      glob: "src/main/webapp/ui/src/**/*.{ts,tsx,json}"
      run: pnpm run i18n:check && pnpm run i18n:lint
