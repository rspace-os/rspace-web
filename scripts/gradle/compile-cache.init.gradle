import org.gradle.api.tasks.compile.JavaCompile

// The producer exports newly written cache entries. Keep that export limited
// to compilation; filtered resources and test results belong to each consumer.
gradle.beforeProject { project ->
  project.tasks.configureEach { task ->
    if (!(task instanceof JavaCompile)) {
      task.outputs.doNotCacheIf('The CI compilation producer only exports JavaCompile outputs') { true }
    }
  }
}
