<IfModule !headers_module>
    LoadModule headers_module modules/mod_headers.so
</IfModule>
<IfModule !proxy_module>
    LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>
<IfModule !rewrite_module>
    LoadModule rewrite_module modules/mod_rewrite.so
</IfModule>

ServerName localhost

# Replace the image default access-log format (CustomLog ... common) so request
# lines omit query strings, which can carry reset tokens.
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" common

ProxyRequests Off
ProxyPreserveHost On
RewriteEngine On

RewriteCond %{REQUEST_URI} ^/otlp/v1/(traces|metrics)$
RewriteCond %{REQUEST_METHOD} !^POST$
RewriteRule ^ - [R=405,L]

RewriteCond %{REQUEST_URI} ^/otlp/v1/(traces|metrics)$
RewriteCond %{HTTP:Content-Encoding} !^$ [OR]
RewriteCond %{HTTP:Content-Type} !^application/(x-protobuf|json)([[:space:]]*;|$) [NC]
RewriteRule ^ - [R=415,L]

RewriteCond %{REQUEST_URI} ^/otlp/v1/(traces|metrics)$
RewriteCond expr "%{HTTP:Content-Length} -gt 524288"
RewriteRule ^ - [R=413,L]

<LocationMatch "^/otlp/v1/(traces|metrics)$">
    RequestHeader unset Authorization
    RequestHeader unset Cookie
    RequestHeader unset Proxy-Authorization
    RequestHeader unset Referer
</LocationMatch>

ProxyPassMatch "^/otlp/v1/(traces|metrics)$" "http://otel-collector:4319/v1/$1" connectiontimeout=5 timeout=30
ProxyPass "/otlp/" "!"

# Long synchronous requests (e.g. archive import) must not hit a proxy timeout.
ProxyPass "/" "http://frontend:8080/" connectiontimeout=5 timeout=3600 upgrade=websocket
ProxyPassReverse "/" "http://frontend:8080/"
