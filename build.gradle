// ---------------------------------------------------------------------------------------------
// Resource filtering: values for ${name} and @name@ placeholders. Precedence, lowest first:
// gradle/resource-filter.properties, the -Denvironment profile's values, -P<name>=<value>, and
// -D<name>=<value>.
// ---------------------------------------------------------------------------------------------
def filterProperties = new TreeMap<String, String>()
file('gradle/resource-filter.properties').withReader('UTF-8') { reader ->
  def props = new Properties()
  props.load(reader)
  props.each { k, v -> filterProperties[k.toString()] = v.toString() }
}
def environmentFilterProperties = [
  // as Maven gave it, ?false=false rather than ?useSSL=false
  'drop-recreate-db'          : ['context.path': '/', 'ssl.enabled': 'false',
                                 'jdbc.url': 'jdbc:mysql://localhost:3306/${jdbc.db.maven}?${ssl.enabled}=false'],
  'drop-recreate-hibernate-db': ['jdbc.db.maven': 'rspace_hib', 'context.path': '/', 'ssl.enabled': 'false',
                                 'jdbc.url': 'jdbc:mysql://localhost:3306/${jdbc.db.maven}?useSSL=false'],
  'keepdbintact'              : ['context.path': '/', 'ssl.enabled': 'false'],
  'prodRelease'               : ['context.path': '/'],
]
filterProperties.putAll(environmentFilterProperties[buildEnvironment] ?: [:])
// Placeholders with no default, left for Spring to resolve unless given.
(filterProperties.keySet() + ['jdbc.url', 'ssl.enabled', 'RS.devlogLevel']).each { name ->
  def value = providers.gradleProperty(name).getOrNull()
  if (value != null) {
    filterProperties[name] = value
  }
}
filterProperties.putAll(cliSystemProperties)
filterProperties['project.version'] = version.toString()
filterProperties['version'] = version.toString()
filterProperties['project.artifactId'] = 'researchspace'
filterProperties['project.basedir'] = projectDir.absolutePath
filterProperties['timestamp'] = buildTimestamp
// resolve values that reference other properties, e.g. propertyFileDirPlaceholder
5.times {
  filterProperties.replaceAll { k, v -> v.replaceAll(/\$\{([A-Za-z0-9_.\-]+)}/) { all, name -> filterProperties[name] ?: all } }
}
def deployment = filterProperties['deployment']

// Binary files, which filtering would corrupt
def binaryPatterns = [
  'zip', 'doc', 'tif', 'tiff', 'jpg', 'png', 'pdf', 'mp3', 'ttf',
  'jpeg', 'gif', 'docx', 'xlsx', 'odt', 'ods', 'odp', 'cdx', 'mp4', 'flv',
].collectMany { ["**/*.${it}".toString(), "**/*.${it.toUpperCase()}".toString()] }

sourceSets {
  main {
    resources {
      // only the selected deployment's folder
      include '*.*', 'formIcons/**', 'META-INF/**', 'sqlUpdates/**', 'scripts/**',
        'velocityTemplates/**', 'archiveResources/**', 'StartUpData/**', 'inventory/**',
        "deployments/${deployment}/**", 'deployments/defaultDeployment.properties', 'fonts/*'
      exclude 'deployments/*/deployment.properties.example'
    }
  }
}

tasks.named('processResources') {
  inputs.properties(filterProperties)
  filteringCharset = 'UTF-8'
  def filterArgs = [properties: new HashMap(filterProperties)]
  // applicationContext-dao.xml keeps its placeholders for deployment.properties at runtime
  filesNotMatching(['applicationContext-dao.xml', 'fonts/**', 'com/**', 'org/**', 'i18n/**'] + binaryPatterns) {
    filter(filterArgs, PlaceholderFilter)
  }
  from('src/main/java') { include '**/*.properties' }
  // shared i18next phrases for JsonMessageSource
  from('src/main/webapp/ui/src/modules/common/i18n/locales') {
    include '**/*.json'
    into 'i18n/locales'
  }
}

tasks.named('processTestResources') {
  inputs.properties(filterProperties)
  filteringCharset = 'UTF-8'
  def filterArgs = [properties: new HashMap(filterProperties)]
  from('src/main/webapp') {
    include '**/*.xml'
    exclude 'ui/node/**', 'ui/node_modules/**', 'ui/dist/**', 'ui/storybook-static/**'
  }
  filesNotMatching(binaryPatterns) {
    filter(filterArgs, PlaceholderFilter)
  }
}

// ---------------------------------------------------------------------------------------------
// Test database: -Denvironment=drop-recreate-db reloads it from the baseline schema before the
// tests; -Denvironment=drop-recreate-hibernate-db leaves rspace_hib empty, for a schema
// generated from the Hibernate mappings (see liquibaseDiff).
// ---------------------------------------------------------------------------------------------
def jdbcDriverScope = configurations.dependencyScope('jdbcDriver')
def jdbcDriverClasspath = configurations.resolvable('jdbcDriverClasspath') { extendsFrom(jdbcDriverScope.get()) }
dependencies {
  jdbcDriver "com.mysql:mysql-connector-j:${pinnedModules['com.mysql:mysql-connector-j'].version}"
}

tasks.register('recreateDatabase', RecreateDatabase) {
  description = 'Drops and recreates the test database (-Denvironment=drop-recreate-db or drop-recreate-hibernate-db).'
  group = LifecycleBasePlugin.VERIFICATION_GROUP
  driverClasspath.from(jdbcDriverClasspath)
  driverClassName = filterProperties['jdbc.driverClassName.maven']
  serverUrl = filterProperties['jdbc.url.maven']
  databaseName = filterProperties['jdbc.db.maven']
  username = filterProperties['jdbc.username.maven']
  password = filterProperties['jdbc.password.maven']
  if (buildEnvironment != 'drop-recreate-hibernate-db') {
    baselineScript = layout.projectDirectory.file('src/main/resources/sqlUpdates/liquibaseConfig/rs-dbbaseline-utf8.sql')
  }
}

if (recreatesDatabase) {
  // Archives and PDFs left in the attachment index folder by earlier runs
  tasks.named('clean') {
    delete fileTree(filterProperties['lucene.attachment.searchIndex']) { include 'archive/*', 'pdfs/*' }
  }
}

// ---------------------------------------------------------------------------------------------
// Tests
// ---------------------------------------------------------------------------------------------
def runProfileITs = ['RunConfigWiringTestIT', 'SysAdminConfigControllerMVCIT', 'SysAdminSupportControllerMVCIT']
def problematicITs = ['ExportApiControllerMVCIT', 'CreateMissingUserFoldersForLabAdminsAndPIsIT']

// With the configuration cache on, Gradle runs a project's tasks in parallel. Test tasks share one
// database, so they take turns.
def testDatabase = gradle.sharedServices.registerIfAbsent('testDatabase', TestDatabase) {
  maxParallelUsages = 1
}

// -Dtest=<pattern>[,<pattern>...], as Surefire took it: a class name or glob, optionally with
// #method (or #m1+m2), a !-prefixed pattern to exclude, or a path such as **/FooTest.java. It
// replaces each test task's own class includes, so -Dtest=FooIT runs FooIT under `test` too.
def testPatterns = setting('test')?.split(',')*.trim()?.findAll { it } ?: []
def toGradleTestPatterns = { String pattern ->
  def (cls, methods) = pattern.contains('#') ? pattern.split('#', 2) as List : [pattern, null]
  cls = cls.replaceAll(/\.(java|class)$/, '').replace('/', '.').replaceAll(/^(\*\*\.)+/, '*.')
  methods ? methods.split('\\+').collect { "${cls}.${it}".toString() } : [cls]
}

def forkCountSetting = setting('forkCount') ?: setting('maxTestForks')
def testForks = forkCountSetting == null ? null : forkCountSetting.endsWith('C')
  ? Math.max(1, (forkCountSetting[0..-2].toBigDecimal() * Runtime.runtime.availableProcessors()).intValue())
  : forkCountSetting.toInteger()
def rerunFailingTestsCount = (setting('surefire.rerunFailingTestsCount') ?: '0').toInteger()
// JUnit tags. Gradle reads -DexcludedTestGroups= (empty, as Surefire's "exclude nothing") the same
// as a bare -DexcludedTestGroups, which cliSystemProperties turns into 'true', so both mean none.
def testGroups = { String name, String defaultGroups ->
  def value = setting(name)
  value == null ? defaultGroups : (value in ['', 'true'] ? '' : value)
}
def fastRun = setting('fast') != null
def includedTestGroups = testGroups('includedTestGroups', '')
def excludedTestGroups = testGroups('excludedTestGroups', 'chemistry')

tasks.withType(Test).configureEach {
  usesService(testDatabase)
  useJUnitPlatform {
    if (!includedTestGroups.isBlank()) {
      includeTags(*includedTestGroups.split(','))
    }
    if (!excludedTestGroups.isBlank()) {
      excludeTags(*excludedTestGroups.split(','))
    }
  }
  maxHeapSize = '1536m'
  jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.io=ALL-UNNAMED',
    '--add-opens=java.rmi/sun.rmi.transport=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED'
  systemProperties cliSystemProperties
  if (recreatesDatabase) {
    dependsOn 'recreateDatabase'
  }
  // Only -Dfast runs, which skip every test that needs a database, may be up to date or come from
  // the build cache. Any other run reads a database whose state Gradle cannot see, so it always
  // runs, as Maven's did.
  if (recreatesDatabase || !fastRun) {
    doNotTrackState('Runs against a database, whose state Gradle cannot track')
  }
  if (testForks != null) {
    maxParallelForks = testForks
  }
  ignoreFailures = setting('maven.test.failure.ignore') == 'true'
  retry {
    maxRetries = rerunFailingTestsCount
    // a test that passes on a rerun counts as flaky, not failed
    failOnPassedAfterRetry = false
  }
  // Report a test that passes on a rerun as Surefire did: one test case with a flakyFailure, and
  // suite counts that leave it out, so report publishers don't count it as failed.
  reports.junitXml.mergeReruns = true
  def junitXmlDir = reports.junitXml.outputLocation
  doLast { JUnitXmlSuiteCounts.recount(junitXmlDir.get().asFile) }
  // Files tests read from the source tree rather than the classpath (JSPs, legacy scripts, API
  // specs, frontend sources), so that a change to one reruns a cacheable (-Dfast) test run.
  inputs.files(fileTree('src/main/webapp') {
    exclude 'ui/node_modules/**', 'ui/dist/**', 'ui/storybook-static/**', 'ui/playwright/**', 'ui/.vite/**'
  }).withPropertyName('webappSources').withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.files('src/main/java', 'src/main/resources', 'src/test/resources')
    .withPropertyName('sourceTreeFiles').withPathSensitivity(PathSensitivity.RELATIVE)
  if (testPatterns) {
    setIncludes([])
    setExcludes([])
    filter {
      failOnNoMatchingTests = false
      testPatterns.each { pattern ->
        if (pattern.startsWith('!')) {
          toGradleTestPatterns(pattern.substring(1)).each { excludeTestsMatching it }
        } else {
          toGradleTestPatterns(pattern).each { includeTestsMatching it }
        }
      }
    }
  }
  testLogging {
    events 'failed'
    exceptionFormat = TestExceptionFormat.FULL
  }
}

tasks.named('test') {
  if (!testPatterns) {
    include '**/Test*.class', '**/*Test.class', '**/*Tests.class', '**/*TestCase.class'
  }
}

def registerItTask = { String name, String desc, Closure configure ->
  tasks.register(name, Test) {
    description = desc
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    mustRunAfter tasks.named('test'), tasks.named('war')
    if (!testPatterns) {
      configure.delegate = it
      configure()
    }
  }
}

def integrationTest = registerItTask('integrationTest', 'Runs the *IT tests, apart from the two groups below.') {
  include '**/*IT.class'
  (runProfileITs + problematicITs).each { exclude "**/${it}.class" }
}
def integrationTestRun = registerItTask('integrationTestRun', 'Runs the run-profile *IT tests.') {
  runProfileITs.each { include "**/${it}.class" }
}
def integrationTestProblematic = registerItTask('integrationTestProblematic', 'Runs the problematic *IT tests.') {
  problematicITs.each { include "**/${it}.class" }
}
integrationTestRun.configure { mustRunAfter integrationTest }
integrationTestProblematic.configure { mustRunAfter integrationTestRun }

def integrationTests = tasks.register('integrationTests') {
  description = 'Runs integrationTest, integrationTestRun and integrationTestProblematic, in that order.'
  group = LifecycleBasePlugin.VERIFICATION_GROUP
  dependsOn integrationTest, integrationTestRun, integrationTestProblematic
}
tasks.named('check') { dependsOn integrationTests }
tasks.register('verify') {
  description = 'Runs the unit and Spring tests, builds the WAR, then runs the integration tests.'
  group = LifecycleBasePlugin.VERIFICATION_GROUP
  dependsOn tasks.named('test'), tasks.named('war'), integrationTests
}

// -DenableTestCoverage: JaCoCo agents on every test task, and XML, CSV and HTML reports after
// `test` (jacocoTestReport) and after the integration tests (jacocoIntegrationTestReport).
if (flag('enableTestCoverage')) {
  apply plugin: 'jacoco'
  jacoco {
    toolVersion = '0.8.15'
  }
  tasks.named('jacocoTestReport', JacocoReport) {
    reports {
      xml.required = true
      csv.required = true
      html.required = true
    }
  }
  def jacocoIntegrationTestReport = tasks.register('jacocoIntegrationTestReport', JacocoReport) {
    description = 'Writes the coverage report for the integration tests.'
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    def itTasks = [integrationTest, integrationTestRun, integrationTestProblematic]
    mustRunAfter itTasks
    // a task skipped by -Dtest leaves no exec file
    executionData.from(files(itTasks.collect { t -> t.map { it.extensions.getByType(JacocoTaskExtension).destinationFile } })
      .filter { it.exists() })
    sourceSets sourceSets.main
    def outDir = layout.buildDirectory.dir('reports/jacoco/integrationTests')
    reports {
      xml.required = true
      xml.outputLocation = outDir.map { it.file('jacocoIntegrationTestReport.xml') }
      csv.required = true
      csv.outputLocation = outDir.map { it.file('jacocoIntegrationTestReport.csv') }
      html.required = true
      html.outputLocation = outDir.map { it.dir('html') }
    }
  }
  tasks.named('test') { finalizedBy 'jacocoTestReport' }
  [integrationTest, integrationTestRun, integrationTestProblematic].each { t ->
    t.configure { finalizedBy jacocoIntegrationTestReport }
  }
}

apply from: 'gradle/ci-tests.gradle'

// ---------------------------------------------------------------------------------------------
// Frontend bundle (-DgenerateReactDist) and Storybook (-DgenerateStorybook=true), skipped when
// their inputs have not changed.
// ---------------------------------------------------------------------------------------------
def uiDir = layout.projectDirectory.dir('src/main/webapp/ui')
def uiSources = uiDir.asFileTree.matching {
  include 'src/**', 'public/**', '.storybook/**', '*.json', '*.ts', '*.js', '*.mjs', '*.cjs', '*.html',
    '.browserslistrc', '.env', '.env.*', '.npmrc'
}
// The pnpm workspace, its lockfile and the build scripts live at the repository root.
def frontendRootInputs = ['package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml']
def pnpmInstall = tasks.register('pnpmInstall', Exec) {
  description = 'Installs frontend dependencies.'
  workingDir = projectDir
  commandLine(['pnpm'] + (setting('frontend.dependencies.install.arg') ?: 'install --frozen-lockfile').split(' ').toList())
  inputs.files(frontendRootInputs + ['src/main/webapp/ui/package.json'].findAll { file(it).exists() })
  outputs.dir(uiDir.dir('node_modules'))
}
// Bundle reuse across runners needs explicit caching, beyond local up-to-date checks.
def frontendToolVersions = ['node': ['pnpm', 'exec', 'node', '--version'], 'pnpm': ['pnpm', '--version']]
def configureFrontendCache = { Exec task ->
  task.outputs.cacheIf('Frontend bundle inputs include source, config, environment and tool versions') { true }
  frontendToolVersions.each { name, command ->
    task.inputs.property(name + 'Version', providers.exec { commandLine command }.standardOutput.asText.map { it.trim() })
  }
  task.inputs.property('viteEnvironment', providers.environmentVariablesPrefixedBy('VITE_'))
  task.inputs.property('storybookEnvironment', providers.environmentVariablesPrefixedBy('STORYBOOK_'))
  ['NODE_ENV', 'NODE_OPTIONS', 'FRONTEND_BUILD_STATS', 'VITEST', 'CI', 'BROWSERSLIST', 'BROWSERSLIST_ENV', 'BROWSERSLIST_CONFIG', 'SOURCE_DATE_EPOCH'].each { name ->
    task.inputs.property(name, providers.environmentVariable(name).orElse(''))
  }
  task.inputs.property('platform', System.getProperty('os.name') + '/' + System.getProperty('os.arch'))
  task.inputs.files('scripts').withPathSensitivity(PathSensitivity.RELATIVE)
}
def buildFrontend = tasks.register('buildFrontend', Exec) {
  description = 'Builds the React/Vite bundle into src/main/webapp/ui/dist.'
  dependsOn pnpmInstall
  workingDir = projectDir
  commandLine 'pnpm', 'run', 'build'
  inputs.property('buildCommand', 'pnpm run build')
  configureFrontendCache(delegate)
  inputs.files(uiSources).withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.files(frontendRootInputs).withPathSensitivity(PathSensitivity.RELATIVE)
  outputs.dir(uiDir.dir('dist'))
}
def buildStorybook = tasks.register('buildStorybook', Exec) {
  description = 'Builds Storybook into src/main/webapp/ui/storybook-static.'
  dependsOn pnpmInstall
  workingDir = projectDir
  commandLine 'pnpm', 'run', 'storybook:build'
  inputs.property('buildCommand', 'pnpm run storybook:build')
  configureFrontendCache(delegate)
  inputs.files(uiSources).withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.files(frontendRootInputs).withPathSensitivity(PathSensitivity.RELATIVE)
  outputs.dir(uiDir.dir('storybook-static'))
}

// ---------------------------------------------------------------------------------------------
// -Denvironment=prodRelease: release checks and htmlDocs, as the old prodRelease profile did.
// ---------------------------------------------------------------------------------------------
// Resolve the Markdown renderer only when the release-only htmlDocs task runs.
sourceSets {
  markdownRenderer { java.srcDir('src/markdownRenderer/java') }
}
dependencies.add('markdownRendererImplementation', 'com.vladsch.flexmark:flexmark-profile-pegdown:0.64.8')

// DevDocs/public rendered to HTML. Nothing in this repository reads them; release tooling may.
def htmlDocs = tasks.register('htmlDocs', com.researchspace.build.MarkdownToHtml) {
  description = 'Renders DevDocs/public/*.md to build/htmlDocs/*.html (run by -Denvironment=prodRelease).'
  source = layout.projectDirectory.dir('DevDocs/public')
  outputDir = layout.buildDirectory.dir('htmlDocs')
  rendererClasspath.from(sourceSets.markdownRenderer.runtimeClasspath)
}

// A Maven snapshot version: ends in SNAPSHOT, or is a deployed snapshot such as 1.0-20260101.120000-1
def isSnapshot = { String v -> v.endsWith('SNAPSHOT') || v ==~ /^.*-\d{8}\.\d{6}-\d+$/ }
def checkReleaseDependencies = tasks.register('checkReleaseDependencies') {
  description = 'Fails if the build or any dependency is a snapshot version (run by -Denvironment=prodRelease).'
  group = LifecycleBasePlugin.VERIFICATION_GROUP
  def projectVersion = version.toString()
  def resolved = ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath'].collect { name ->
    configurations.named(name).flatMap { it.incoming.artifacts.resolvedArtifacts }.map { arts ->
      arts.collect { it.id.componentIdentifier }.findAll { it instanceof ModuleComponentIdentifier }
        .collect { "${it.group}:${it.module}:${it.version}".toString() }
    }
  }
  doLast {
    // The -<timestamp> suffix makes 2.28.0-SNAPSHOT-<timestamp> a release version, as it was for
    // the enforcer's requireReleaseVersion rule.
    if (isSnapshot(projectVersion)) {
      throw new GradleException("Release builds need a release version, not ${projectVersion}")
    }
    def snapshots = resolved.collectMany { it.get() }.unique().sort().findAll { isSnapshot(it.split(':')[2]) }
    if (snapshots) {
      throw new GradleException("Release builds cannot depend on snapshots:\n  ${snapshots.join('\n  ')}")
    }
  }
}

if (prodRelease) {
  tasks.named('processResources') { dependsOn htmlDocs }
  tasks.named('war') { dependsOn checkReleaseDependencies }
}

tasks.named('war') {
  archiveFileName = "researchspace-${project.version}.war"
  exclude 'ui/node/**', 'ui/node_modules/**', 'ui/dist/stats.json', 'ui/dist/stats.html', 'ui/stats.html', 'ui/storybook-static/**'
  inputs.properties(filterProperties)
  def filterArgs = [properties: new HashMap(filterProperties)]
  filesMatching(['META-INF/**', 'WEB-INF/security.xml']) {
    filter(filterArgs, PlaceholderFilter)
  }
  if (flag('generateReactDist')) {
    dependsOn buildFrontend
  }
  if (setting('generateStorybook') == 'true') {
    // under WEB-INF, so the deployment property controls access to it
    from(buildStorybook) { into 'WEB-INF/storybook' }
  }
}

tasks.register('printVersion') {
  description = 'Prints the project version.'
  def v = version.toString()
  doLast { println v }
}

// ---------------------------------------------------------------------------------------------
// Formatting: spotlessApply and spotlessCheck (under `check`). -DspotlessStrict adds CleanThat;
// -DspotlessFiles=<regex>[,<regex>...] limits both to files whose absolute path matches one.
// ---------------------------------------------------------------------------------------------
def spotlessFiles = setting('spotlessFiles')?.split(',')*.trim()?.findAll { it }
spotless {
  java {
    target 'src/**/*.java', 'buildSrc/src/**/*.java'
    if (spotlessFiles) {
      target(sourceSets.main.allJava.plus(sourceSets.test.allJava).plus(sourceSets.markdownRenderer.allJava).plus(fileTree('buildSrc/src') { include '**/*.java' }).filter { f ->
        spotlessFiles.any { f.absolutePath.matches(it) }
      })
    }
    toggleOffOn()
    if (flag('spotlessStrict')) {
      // Off by default because it rewrites more than formatting
      cleanthat().sourceCompatibility('1.7')
    }
    removeUnusedImports()
    googleJavaFormat('1.28.0').reflowLongStrings()
  }
}

// ---------------------------------------------------------------------------------------------
// liquibaseDiff: writes the changes that would bring the rspace database's schema in line with
// rspace_hib's to generatedDBChangeSets/diffChangeset-<timestamp>.xml. Connection settings come
// from sqlUpdates/liquibaseConfig/liquibase.properties; override one with -Dliquibase.<key>.
// ---------------------------------------------------------------------------------------------
def liquibaseScope = configurations.dependencyScope('liquibase')
def liquibaseClasspath = configurations.resolvable('liquibaseClasspath') { extendsFrom(liquibaseScope.get()) }
dependencies {
  liquibase "org.liquibase:liquibase-core:${pinnedModules['org.liquibase:liquibase-core'].version}"
  liquibase "com.mysql:mysql-connector-j:${pinnedModules['com.mysql:mysql-connector-j'].version}"
  // the command line's parser, which liquibase-core does not bring along
  liquibase "info.picocli:picocli:${pinnedModules['info.picocli:picocli'].version}"
}
tasks.register('liquibaseDiff', JavaExec) {
  description = 'Writes a Liquibase changelog of the schema differences between rspace and rspace_hib.'
  group = 'database'
  classpath = files(liquibaseClasspath)
  mainClass = 'liquibase.integration.commandline.LiquibaseCommandLine'
  def lbProperties = new Properties()
  file('src/main/resources/sqlUpdates/liquibaseConfig/liquibase.properties').withReader('UTF-8') { lbProperties.load(it) }
  def lb = { String key -> cliSystemProperties["liquibase.${key}".toString()] ?: lbProperties.getProperty(key) }
  // Liquibase writes to a fixed file, renamed when the task runs to diffChangeset-<stamp>.xml.
  // The stamp is -Dtimestamp, or the time the task runs: computed at configuration time, the
  // configuration cache would reuse it and later diffs would overwrite the first.
  def fixedStamp = setting('timestamp')
  def changeSetsDir = layout.projectDirectory.dir('generatedDBChangeSets').asFile
  def outFile = layout.projectDirectory.file('generatedDBChangeSets/diffChangeset-inprogress.xml')
  def password = lb('password')
  def referencePassword = lb('referencePassword')
  args '--show-banner=false', '--log-level=WARNING',
    "--driver=${lb('driver')}", "--url=${lb('url')}", "--username=${lb('username')}",
    "--reference-url=${lb('referenceUrl')}", "--reference-username=${lb('referenceUsername')}",
    "--changelog-file=${outFile.asFile.absolutePath}", 'diff-changelog'
  // kept out of the command line, which other users of the machine can read
  environment 'LIQUIBASE_COMMAND_PASSWORD', password
  environment 'LIQUIBASE_COMMAND_REFERENCE_PASSWORD', referencePassword
  outputs.upToDateWhen { false }
  doFirst {
    changeSetsDir.mkdirs()
    outFile.asFile.delete()
  }
  doLast { task ->
    def stamp = fixedStamp ?: CurrentUtcTimestamp.FORMAT.format(ZonedDateTime.now(ZoneOffset.UTC))
    def target = new File(changeSetsDir, "diffChangeset-${stamp}.xml")
    if (outFile.asFile.exists()) {
      java.nio.file.Files.move(outFile.asFile.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
      task.logger.lifecycle("Wrote ${target}")
    }
  }
}

// ---------------------------------------------------------------------------------------------
// Dependency checks
// ---------------------------------------------------------------------------------------------
def classpathNames = ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath']
def resolvedModules = { String name ->
  configurations.named(name).flatMap { it.incoming.artifacts.resolvedArtifacts }.map { arts ->
    arts.collect { it.id.componentIdentifier }
      .findAll { it instanceof ModuleComponentIdentifier }
      .collect { "${it.group}:${it.module}:${it.version}".toString() }
      .unique().sort()
  }
}

// Writes resolved module coordinates per classpath to build/classpaths, to diff before and after
// a dependency change.
tasks.register('dumpClasspaths') {
  description = 'Writes the modules on each classpath to build/classpaths/<classpath>.txt.'
  def classpaths = classpathNames.collectEntries { [(it): resolvedModules(it)] }
  def outDir = layout.buildDirectory.dir('classpaths')
  outputs.dir(outDir)
  doLast {
    classpaths.each { name, coords -> outDir.get().file("${name}.txt").asFile.text = coords.get().join('\n') + '\n' }
  }
}

// Every module on a classpath needs a pin, so that its version is chosen deliberately, and every
// pin needs a module, so the list does not rot.
tasks.register('checkPinnedVersions') {
  description = 'Checks that gradle/pinned-versions.txt lists exactly the modules on the classpaths, at the declared versions.'
  group = LifecycleBasePlugin.VERIFICATION_GROUP
  def classpaths = classpathNames.collect { resolvedModules(it) }
  def pinned = pinnedModules.keySet()
  def pinVersions = pinnedModules.collectEntries { ga, m -> [(ga): m.version] }
  // Versions written in the dependencies blocks, which the forced pins silently override. The jetty
  // configurations are left out: gradle/jetty.gradle clears the pins there on purpose.
  def declared = configurations.findAll { !it.name.startsWith('jetty') }.collectMany { conf ->
    conf.dependencies.withType(ExternalModuleDependency).findAll { it.version }
      .collect { "${conf.name} ${it.group}:${it.name} ${it.version}".toString() }
  }.unique()
  inputs.file('gradle/pinned-versions.txt')
  doLast {
    def mismatched = declared.findAll { line ->
      def (conf, ga, version) = line.split(' ')
      pinVersions[ga] != null && pinVersions[ga] != version
    }.collect { line ->
      def (conf, ga, version) = line.split(' ')
      "${ga}: declared ${version} in ${conf}, pinned ${pinVersions[ga]}"
    }.unique()
    if (mismatched) {
      throw new GradleException('Declared dependency versions differ from gradle/pinned-versions.txt, ' +
        'whose versions win. Make them equal:\n  ' + mismatched.sort().join('\n  '))
    }
    def resolved = classpaths.collectMany { it.get() }.collect { it.split(':')[0..1].join(':') }.toSet()
    // Gradle-only: JUnit's launcher, and the bnd/OSGi annotations log4j's Gradle metadata adds
    def unpinned = (resolved - pinned).findAll { !(it ==~ /org\.junit\.platform:junit-platform-launcher|biz\.aQute\.bnd:.*|org\.osgi:.*/) }
    def unused = (pinned - resolved).findAll { it != 'com.squareup.okio:okio' }
    if (unpinned || unused) {
      throw new GradleException('gradle/pinned-versions.txt is out of step with the classpaths.' +
        (unpinned ? "\nAdd a pin for:\n  ${unpinned.sort().join('\n  ')}" : '') +
        (unused ? "\nRemove the pin for:\n  ${unused.sort().join('\n  ')}" : ''))
    }
  }
}
tasks.named('check') { dependsOn 'checkPinnedVersions' }

apply from: 'gradle/jetty.gradle'
