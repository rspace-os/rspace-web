// Trial Gradle build mirroring pom.xml for compile, test, and WAR packaging. Maven remains
// the supported build. See DevDocs/DeveloperNotes/GradleMigrationTrial.md.

plugins {
  id 'war'
  id 'com.diffplug.spotless' version '8.11.0'
}

group = 'com.github.rspace-os'

// Maven stamps every build with a fresh timestamp, so rs.properties changes on every run and
// nothing downstream of it can be up to date. Local builds use a fixed value; release builds
// pass -Ptimestamp=<value>, or -Ptimestamp=now.
def buildTimestamp = providers.gradleProperty('timestamp').map {
  it == 'now' ? DateTimeFormatter.ofPattern("yyyyMMdd'T'HHmmss'Z'").format(ZonedDateTime.now(ZoneOffset.UTC)) : it
}.getOrElse('dev')
version = "2.28.0-SNAPSHOT-${buildTimestamp}"

java {
  // The JDK running Gradle compiles with --release 17, as maven-compiler-plugin does.
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
  options.release = 17
  options.encoding = 'UTF-8'
  options.compilerArgs.add('-parameters')
}

// ---------------------------------------------------------------------------------------------
// Dependency versions and scopes: match what Maven resolves for pom.xml, since Gradle's
// highest-version conflict resolution and scope handling differ from Maven's nearest-wins.
// ---------------------------------------------------------------------------------------------
def mavenModules = [:]
file('gradle/maven-resolved-versions.txt').eachLine { line ->
  if (line.isBlank() || line.startsWith('#')) {
    return
  }
  def (ga, rest) = line.split('=', 2)
  def (version, scope) = rest.trim().split(' ')
  mavenModules[ga] = [version: version, scope: scope]
}

configurations.configureEach {
  resolutionStrategy.force(mavenModules.collect { ga, m -> "${ga}:${m.version}".toString() })
}

// Maven narrows a module to the scope of its nearest declaration, so spring-test declared
// test-scoped stays off the main classpath even when a compile dependency drags it in. Gradle
// keeps each edge's own scope, so exclude what Maven keeps out. Maven's test classpaths hold
// every scope and need no excludes.
def excludeMavenScopes = { Configuration conf, List<String> scopes ->
  mavenModules.findAll { ga, m -> m.scope in scopes }.keySet().each { ga ->
    def (g, a) = ga.split(':')
    conf.exclude(group: g, module: a)
  }
}
configurations.compileClasspath { excludeMavenScopes(it, ['runtime', 'test']) }
configurations.runtimeClasspath { excludeMavenScopes(it, ['test', 'provided']) }

