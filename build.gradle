    testCompileOnly("${ga}:${m.version}") { transitive = false }
  }
}

// ---------------------------------------------------------------------------------------------
// Resource filtering: values for ${name} and @name@ placeholders, from
// gradle/resource-filter.properties (pom.xml's <properties>), overridable with -P<name>=<value>
// as Maven allowed with -D<name>=<value>.
// ---------------------------------------------------------------------------------------------
def filterProperties = new TreeMap<String, String>()
file('gradle/resource-filter.properties').withReader('UTF-8') { reader ->
  def props = new Properties()
  props.load(reader)
  props.each { k, v -> filterProperties[k.toString()] = providers.gradleProperty(k.toString()).getOrElse(v.toString()) }
}
// -Penvironment=drop-recreate-db mirrors pom.xml's mysql-clean-liquibase profile: test tasks
// first run recreateDatabase, and resources get the profile's properties.
def dropRecreateDb = providers.gradleProperty('environment').getOrNull() == 'drop-recreate-db'
def profileFilterProperties = dropRecreateDb ? [
  'ssl.enabled': 'false',
  // as in pom.xml, which yields ?false=false rather than ?useSSL=false
  'jdbc.url': 'jdbc:mysql://localhost:3306/${jdbc.db.maven}?${ssl.enabled}=false',
] : [:]
// Maven filters with every -D property. These placeholders have no default and are replaced only
// when given as -P<name>=<value> (or by the profile above); others stay for Spring to resolve.
['jdbc.url', 'ssl.enabled', 'RS.devlogLevel'].each { name ->
  def value = providers.gradleProperty(name).getOrNull() ?: profileFilterProperties[name]
  if (value != null) {
    filterProperties[name] = value
  }
}
filterProperties['project.version'] = version.toString()
filterProperties['version'] = version.toString()
filterProperties['project.artifactId'] = 'researchspace'
filterProperties['project.basedir'] = projectDir.absolutePath
// resolve values that reference other properties, e.g. propertyFileDirPlaceholder
5.times {
  filterProperties.replaceAll { k, v -> v.replaceAll(/\$\{([A-Za-z0-9_.\-]+)}/) { all, name -> filterProperties[name] ?: all } }
}
def deployment = filterProperties['deployment']

// The extensions in pom.xml's nonFilteredFileExtensions: binaries, which filtering would corrupt.
// Keep the two lists in step.
def binaryPatterns = [
  'zip', 'doc', 'tif', 'tiff', 'jpg', 'png', 'pdf', 'mp3', 'ttf',
  'jpeg', 'gif', 'docx', 'xlsx', 'odt', 'ods', 'odp', 'cdx', 'mp4', 'flv',
].collectMany { ["**/*.${it}".toString(), "**/*.${it.toUpperCase()}".toString()] }

sourceSets {
  main {
    resources {
      include '*.*', 'formIcons/**', 'META-INF/**', 'sqlUpdates/**', 'scripts/**',
        'velocityTemplates/**', 'archiveResources/**', 'StartUpData/**', 'inventory/**',
        "deployments/${deployment}/**", 'deployments/defaultDeployment.properties', 'fonts/*'
      exclude 'deployments/*/deployment.properties.example'
    }
  }
}

tasks.named('processResources') {
  inputs.properties(filterProperties)
  filteringCharset = 'UTF-8'
  def filterArgs = [properties: new HashMap(filterProperties)]
  filesNotMatching(['applicationContext-dao.xml', 'fonts/**', 'com/**', 'org/**', 'i18n/**'] + binaryPatterns) {
    filter(filterArgs, MavenPlaceholderFilter)
  }
  from('src/main/java') { include '**/*.properties' }
  from('src/main/webapp/ui/src/modules/common/i18n/locales') {
    include '**/*.json'
    into 'i18n/locales'
  }
}

tasks.named('processTestResources') {
  inputs.properties(filterProperties)
  filteringCharset = 'UTF-8'
  def filterArgs = [properties: new HashMap(filterProperties)]
  from('src/main/webapp') {
    include '**/*.xml'
    exclude 'ui/node/**', 'ui/node_modules/**', 'ui/dist/**', 'ui/storybook-static/**'
  }
  filesNotMatching(binaryPatterns) {
    filter(filterArgs, MavenPlaceholderFilter)
  }
}

// ---------------------------------------------------------------------------------------------
// Tests, mirroring the Surefire executions in pom.xml
// ---------------------------------------------------------------------------------------------
def jdbcDriverScope = configurations.dependencyScope('jdbcDriver')
def jdbcDriverClasspath = configurations.resolvable('jdbcDriverClasspath') { extendsFrom(jdbcDriverScope.get()) }
dependencies {
  jdbcDriver "com.mysql:mysql-connector-j:${mavenModules['com.mysql:mysql-connector-j'].version}"
}

tasks.register('recreateDatabase', RecreateDatabase) {
  description = 'Drops the test database and recreates it from the baseline schema (-Penvironment=drop-recreate-db).'
  group = LifecycleBasePlugin.VERIFICATION_GROUP
  driverClasspath.from(jdbcDriverClasspath)
  driverClassName = filterProperties['jdbc.driverClassName.maven']
  serverUrl = filterProperties['jdbc.url.maven']
  databaseName = filterProperties['jdbc.db.maven']
  username = filterProperties['jdbc.username.maven']
  password = filterProperties['jdbc.password.maven']
  baselineScript = layout.projectDirectory.file('src/main/resources/sqlUpdates/liquibaseConfig/rs-dbbaseline-utf8.sql')
}

// Surefire passes every Maven -D property to the test JVM. Gradle passes on only these -D
// properties: switches the tests read, and JVM settings CI sets. Add new ones here.
def forwardedTestSystemProperties = [
  'fast', 'deployment', 'nightly', 'weekly', 'RS_FILE_BASE', 'hibtest.db', 'loggingDirectory',
  'javax.xml.accessExternalDTD', 'log4j2.configurationFile', 'bioportal.api.key',
  'bioportal.realConnectionTests', 'digitalCommons.realConnectionTests',
  'fieldmark.realConnectionTests', 'licenseServer.realConnectionTests', 'slack.realConnectionTests',
]

def runProfileITs = ['RunConfigWiringTestIT', 'SysAdminConfigControllerMVCIT', 'SysAdminSupportControllerMVCIT']
def problematicITs = ['ExportApiControllerMVCIT', 'CreateMissingUserFoldersForLabAdminsAndPIsIT']

// With the configuration cache on, Gradle runs a project's tasks in parallel. Test tasks share one
// database, so they take turns, as Surefire's executions do.
def testDatabase = gradle.sharedServices.registerIfAbsent('testDatabase', TestDatabase) {
  maxParallelUsages = 1
}

tasks.withType(Test).configureEach {
  usesService(testDatabase)
  useJUnitPlatform {
    def included = providers.gradleProperty('includedTestGroups').getOrElse('')
    if (!included.isBlank()) {
      includeTags(*included.split(','))
    }
    excludeTags(*providers.gradleProperty('excludedTestGroups').getOrElse('chemistry').split(','))
  }
  maxHeapSize = '1536m'
  jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.io=ALL-UNNAMED',
    '--add-opens=java.rmi/sun.rmi.transport=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED'
  forwardedTestSystemProperties.each { name ->
    def value = providers.systemProperty(name).getOrNull()
    if (value != null) {
      systemProperty name, value
    }
  }
  if (dropRecreateDb) {
    dependsOn 'recreateDatabase'
    doNotTrackState('Runs against a database recreated for this build')
  }
  def forks = providers.gradleProperty('maxTestForks').getOrNull()
  if (forks != null) {
    maxParallelForks = forks.toInteger()
  }
  testLogging {
    events 'failed'
    exceptionFormat = TestExceptionFormat.FULL
  }
}

tasks.named('test') {
  // Surefire's default includes
  include '**/Test*.class', '**/*Test.class', '**/*Tests.class', '**/*TestCase.class'
}

def registerItTask = { String name, String desc, Closure configure ->
  tasks.register(name, Test) {
    description = desc
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    mustRunAfter tasks.named('test')
    configure.delegate = it
    configure()
  }
}

def integrationTest = registerItTask('integrationTest', 'Runs *IT tests (Surefire integration-tests execution).') {
  include '**/*IT.class'
  (runProfileITs + problematicITs).each { exclude "**/${it}.class" }
}
def integrationTestRun = registerItTask('integrationTestRun', 'Runs the run-profile *IT tests.') {
  runProfileITs.each { include "**/${it}.class" }
}
def integrationTestProblematic = registerItTask('integrationTestProblematic', 'Runs the problematic *IT tests.') {
  problematicITs.each { include "**/${it}.class" }
}
// Surefire's execution order
integrationTestRun.configure { mustRunAfter integrationTest }
integrationTestProblematic.configure { mustRunAfter integrationTestRun }
tasks.named('check') { dependsOn integrationTest, integrationTestRun, integrationTestProblematic }

// ---------------------------------------------------------------------------------------------
// Frontend bundle (Maven's -DgenerateReactDist profile). Unlike the exec-maven-plugin
// executions, these tasks are skipped when their inputs have not changed.
// ---------------------------------------------------------------------------------------------
def uiDir = layout.projectDirectory.dir('src/main/webapp/ui')
def pnpmInstall = tasks.register('pnpmInstall', Exec) {
  description = 'Installs frontend dependencies.'
  workingDir = projectDir
  commandLine 'pnpm', 'install', '--frozen-lockfile'
  inputs.files('package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', uiDir.file('package.json'))
  outputs.dir(uiDir.dir('node_modules'))
}
def buildFrontend = tasks.register('buildFrontend', Exec) {
  description = 'Builds the React/Vite bundle into src/main/webapp/ui/dist.'
  dependsOn pnpmInstall
  workingDir = projectDir
  commandLine 'pnpm', 'run', 'build'
  inputs.dir(uiDir.dir('src')).withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.files(uiDir.asFileTree.matching { include '*.json', '*.ts', '*.js', '*.mjs', '*.cjs', '*.html' })
    .withPathSensitivity(PathSensitivity.RELATIVE)
  outputs.dir(uiDir.dir('dist'))
}

tasks.named('war') {
  archiveFileName = "researchspace-${project.version}.war"
  exclude 'ui/node/**', 'ui/node_modules/**', 'ui/dist/stats.json', 'ui/storybook-static/**'
  inputs.properties(filterProperties)
  def filterArgs = [properties: new HashMap(filterProperties)]
  filesMatching(['META-INF/**', 'WEB-INF/security.xml']) {
    filter(filterArgs, MavenPlaceholderFilter)
  }
  if (providers.gradleProperty('generateReactDist').isPresent()) {
    dependsOn buildFrontend
  }
}

// ---------------------------------------------------------------------------------------------
// Formatting. Maven runs spotless:apply on every compile; here it is an explicit spotlessApply
// task plus spotlessCheck under `check`, so compilation stays cacheable.
// ---------------------------------------------------------------------------------------------
spotless {
  java {
    toggleOffOn()
    removeUnusedImports()
    googleJavaFormat('1.28.0').reflowLongStrings()
  }
}

// Writes resolved module coordinates per classpath to build/classpaths, for comparison with
// `mvn dependency:list` (see scripts/gradle/compare-classpaths.sh).
tasks.register('dumpClasspaths') {
  def classpaths = ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath'].collectEntries { name ->
    [(name): configurations.named(name).flatMap { it.incoming.artifacts.resolvedArtifacts }.map { arts ->
      arts.collect { it.id.componentIdentifier }
        .findAll { it instanceof ModuleComponentIdentifier }
        .collect { "${it.group}:${it.module}:${it.version}".toString() }
        .sort()
    }]
  }
  def outDir = layout.buildDirectory.dir('classpaths')
  outputs.dir(outDir)
  doLast {
    classpaths.each { name, coords -> outDir.get().file("${name}.txt").asFile.text = coords.get().join('\n') + '\n' }
  }
}
