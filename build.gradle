// ---------------------------------------------------------------------------------------------
// Build settings. Every -D<name>=<value> on the command line is a build setting, as Maven user
// properties were: it overrides the resource-filter property of that name, and reaches every test
// JVM and the Jetty JVM as a system property. -P<name>=<value> also works for the switches below
// and the resource-filter defaults.
// ---------------------------------------------------------------------------------------------
// The Gradle client sets these itself on every invocation.
def gradleClientProperties = ['file.encoding', 'user.country', 'user.language', 'user.variant']
def cliPropertyNames = gradle.startParameter.systemPropertiesArgs.keySet() - gradleClientProperties
// Read through a provider so that the configuration cache notices added or changed -D values.
// A bare -D<name> means true, as it did for Maven.
def cliSystemProperties = new TreeMap<String, String>(
  providers.systemPropertiesPrefixedBy('').get().findAll { k, v -> k in cliPropertyNames }
    .collectEntries { k, v -> [(k): v == '' ? 'true' : v] })
// gradle/jetty.gradle forwards these to the Jetty JVM.
ext.cliSystemProperties = cliSystemProperties

def setting = { String name -> cliSystemProperties.containsKey(name) ? cliSystemProperties[name] : providers.gradleProperty(name).getOrNull() }
// Maven activated these profiles when the property was defined at all, whatever its value.
def flag = { String name -> setting(name) != null }

def buildEnvironment = setting('environment')
def knownEnvironments = [null, 'drop-recreate-db', 'drop-recreate-hibernate-db', 'keepdbintact', 'prodRelease']
if (!(buildEnvironment in knownEnvironments)) {
  throw new GradleException("Unknown -Denvironment=${buildEnvironment}; expected one of ${knownEnvironments.drop(1).join(', ')}")
}
def prodRelease = buildEnvironment == 'prodRelease'
// Test tasks (and jettyRun) first drop and recreate the test database.
def recreatesDatabase = buildEnvironment in ['drop-recreate-db', 'drop-recreate-hibernate-db']
ext.recreatesDatabase = recreatesDatabase

// As maven-enforcer-plugin's requireJavaVersion did: the JVM running Gradle also runs Spotless and
// the other plugins, which fail late and cryptically on other versions.
if (!(JavaVersion.current().majorVersion in ['17', '21'])) {
  throw new GradleException("RSpace builds on Java 17 or 21, not ${JavaVersion.current()}. Run Gradle with one of those " +
    '(JAVA_HOME), and pass -Djava-version to pick the toolchain JDK.')
}

// Stamped into the version and rs.properties. A fixed default keeps resources up to date between
// local builds; release builds pass -Dtimestamp=<value>, or -Dtimestamp=now.
// 'now' is read through a value source, which Gradle re-evaluates on every build, so the
// configuration cache cannot freeze an earlier build's time.
def buildTimestamp = (setting('timestamp') ?: 'dev').with {
  it == 'now' ? providers.of(CurrentUtcTimestamp) {}.get() : it
}
version = "2.28.0-SNAPSHOT-${buildTimestamp}"

// -Djava-version / -Djava-vendor pick the JDK that compiles and runs the tests from the installed
// ones (JAVA_HOME, ~/.m2/toolchains.xml, SDKMAN and the other places Gradle looks), as the Maven
// toolchains plugin did. Nothing is downloaded. Without them, the JDK running Gradle compiles.
def toolchainVendors = [
  temurin: JvmVendorSpec.ADOPTIUM, adoptium: JvmVendorSpec.ADOPTIUM, zulu: JvmVendorSpec.AZUL,
  azul: JvmVendorSpec.AZUL, corretto: JvmVendorSpec.AMAZON, amazon: JvmVendorSpec.AMAZON,
  microsoft: JvmVendorSpec.MICROSOFT, oracle: JvmVendorSpec.ORACLE, graalvm: JvmVendorSpec.GRAAL_VM,
  liberica: JvmVendorSpec.BELLSOFT, bellsoft: JvmVendorSpec.BELLSOFT, semeru: JvmVendorSpec.IBM,
  ibm: JvmVendorSpec.IBM, sapmachine: JvmVendorSpec.SAP, sap: JvmVendorSpec.SAP,
]
def javaVersionSetting = setting('java-version')
def javaVendorSetting = setting('java-vendor')
java {
  if (javaVersionSetting != null || javaVendorSetting != null) {
    toolchain {
      languageVersion = JavaLanguageVersion.of(javaVersionSetting ?: '17')
      // "openjdk", Maven's default vendor, names no particular build, so it matches any JDK.
      if (javaVendorSetting != null && javaVendorSetting.toLowerCase() != 'openjdk') {
        vendor = toolchainVendors[javaVendorSetting.toLowerCase()] ?: JvmVendorSpec.matching(javaVendorSetting)
      }
    }
  } else {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }
}

tasks.withType(JavaCompile).configureEach {
  options.release = 17
  options.encoding = 'UTF-8'
  options.compilerArgs.add('-parameters')
}

// ---------------------------------------------------------------------------------------------
// Dependency versions and scopes, from gradle/pinned-versions.txt. Forcing every module's version
// replaces Gradle's highest-version conflict resolution with one chosen version per module.
// ---------------------------------------------------------------------------------------------
def pinnedModules = [:]
file('gradle/pinned-versions.txt').eachLine { line ->
  if (line.isBlank() || line.startsWith('#')) {
    return
  }
  def (ga, rest) = line.split('=', 2)
  def (version, scope) = rest.trim().split(' ')
  pinnedModules[ga] = [version: version, scope: scope]
}

// JaCoCo's own tooling resolves its own versions.
configurations.matching { !it.name.startsWith('jacoco') }.configureEach {
  resolutionStrategy.force(pinnedModules.collect { ga, m -> "${ga}:${m.version}".toString() })
}

// A module stays off the classpaths its pinned scope excludes, even when a dependency of another
// scope drags it in: spring-test, say, stays off the main classpath. Test classpaths hold every
// scope.
def excludePinnedScopes = { Configuration conf, List<String> scopes ->
  pinnedModules.findAll { ga, m -> m.scope in scopes }.keySet().each { ga ->
    def (g, a) = ga.split(':')
    conf.exclude(group: g, module: a)
  }
}
configurations.compileClasspath { excludePinnedScopes(it, ['runtime', 'test']) }
configurations.runtimeClasspath { excludePinnedScopes(it, ['test', 'provided']) }

